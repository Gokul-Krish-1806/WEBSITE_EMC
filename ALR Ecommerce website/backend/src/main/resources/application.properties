spring.application.name=alr-store-api
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/alr_store?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:alr_app}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jackson.serialization.write-dates-as-timestamps=false
spring.servlet.multipart.max-file-size=300KB
spring.servlet.multipart.max-request-size=350KB
app.jwt.secret=${JWT_SECRET:}
app.jwt.issuer=alr-store
app.jwt.expiration=PT12H
app.shipping.free-threshold=4999
app.shipping.fee=149
app.admin.email=${ALR_ADMIN_EMAIL:}
app.admin.password=${ALR_ADMIN_PASSWORD:}
app.upload.directory=${UPLOAD_DIRECTORY:./uploads}
